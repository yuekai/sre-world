# --- fault and workload settings ---
erpnext:
  worker:
    default:
      replicaCount: 0
    short:
      replicaCount: 0
    long:
      replicaCount: 0
    scheduler:
      replicaCount: 0
  socketio:
    replicaCount: 0
  mariadb-subchart:
    primary:
      configuration: '[mysqld]

        skip-name-resolve

        explicit_defaults_for_timestamp

        basedir=/opt/bitnami/mariadb

        plugin_dir=/opt/bitnami/mariadb/plugin

        port=3306

        socket=/opt/bitnami/mariadb/tmp/mysql.sock

        tmpdir=/opt/bitnami/mariadb/tmp

        max_allowed_packet=16M

        bind-address=*

        pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid

        log-error=/opt/bitnami/mariadb/logs/mysqld.log

        character-set-server=UTF8

        collation-server=utf8_general_ci

        slow_query_log=0

        slow_query_log_file=/opt/bitnami/mariadb/logs/mysqld.log

        long_query_time=10.0

        performance_schema=ON

        max_connections=200


        [client]

        port=3306

        socket=/opt/bitnami/mariadb/tmp/mysql.sock

        default-character-set=UTF8

        plugin_dir=/opt/bitnami/mariadb/plugin


        [manager]

        port=3306

        socket=/opt/bitnami/mariadb/tmp/mysql.sock

        pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid'
loadgen:
  profile: frappe_db
  enabled: true
# --- agent access settings ---
agentSurface:
  profile: confined
# --- grading-harness settings ---
gradingHarness:
  podState:
    enabled: true
  answerKey:
    enabled: true
  dbState:
    enabled: false
  lockState:
    enabled: false
# --- agent report vocabulary ---
agentReport:
  vocabulary:
    services:
    - frappe_web
    - frappe-worker-short
    - frappe-worker-default
    - frappe-worker-long
    - frappe-scheduler
    - frappe-socketio
    - mariadb
    - redis-cache
    - redis-queue
    - network
    - load-generator
    components:
    - frappe_web.db-conn
    - frappe_web.handler
    - frappe_web.config
    - frappe-worker-short.db-conn
    - frappe-worker-short.rq-queue
    - frappe-worker-default.db-conn
    - frappe-worker-default.rq-queue
    - frappe-worker-long.db-conn
    - frappe-worker-long.rq-queue
    - frappe-scheduler.tick
    - frappe-scheduler.db-conn
    - frappe-socketio.affinity
    - frappe-socketio.config
    - mariadb.max-connections
    - mariadb.config
    - mariadb.storage
    - redis-cache.config
    - redis-queue.config
    - network
# --- pinned-image settings ---
global:
  imagePullPolicy: IfNotPresent
images:
  main: ghcr.io/yuekai/sre-world/frappe-main@sha256:d40b49eb1c050f14d4fa91ad5bb894ee1db61724466caea903ee0a952574210e
  loadgen: ghcr.io/yuekai/sre-world/frappe-loadgen@sha256:0372494536eb9a0b40745cdc92a1915ec5b144a67f8bc509845eba5e411b310c
  obsMcp: ghcr.io/yuekai/sre-world/frappe-obs-mcp@sha256:1646a2a67d5d0e484dc1b760c2900cb756c7986e9a86cead61175b2737883808
  frappeAdmin: ghcr.io/yuekai/sre-world/frappe-admin-sidecar@sha256:9975944f1d375dea6afb9c35159f978c4d82691f232e4818ff7faff66121cd2d
platformTools:
  enabled: true
  image: ghcr.io/yuekai/sre-world/codex-tools@sha256:c0ed85e5280e4d70c3ec341288fd240d2d64647d952db3712f94cd27c9c08d64
  digest: sha256:c0ed85e5280e4d70c3ec341288fd240d2d64647d952db3712f94cd27c9c08d64

substrate: "saleor-spine"

fault:
  tier: runtime
  header: |
    Scenario saleor-spine/10-T1 - the API's database role carries a per-role
    statement_timeout of 150 ms (ALTER ROLE saleor_app IN DATABASE saleor).

    Short storefront reads stay under the limit, so the API looks healthy
    between bursts; checkout's longer transactions hit SQLSTATE 57014 when
    traffic peaks. The setting lives in pg_db_role_setting and applies to new
    sessions only, so a repair must be durable for fresh connections without
    restarting Saleor or PostgreSQL. Minimal correct fix: ALTER ROLE saleor_app
    IN DATABASE saleor RESET statement_timeout, then let pooled sessions recycle.
  values:
    faultInit:
      postgres:
        enabled: true
        readyMarker: true
        statements:
          - "ALTER ROLE saleor_app IN DATABASE saleor SET statement_timeout = '150ms'"

difficulty:

# Saleor-only profiles, resolved against the shared builtin registry using the
# same data-loading pattern as Frappe.

profiles:
  saleor_dev:
    seed: 42
    warmup_s: 25.0
    warmup_rps: 1.5
    cycles:
    - [14.0, 6.0, 34.0, 1.4]
    - [9.0, 7.5, 41.0, 0.9]
    - [17.0, 5.0, 30.0, 1.7]
    soak_cycles: 1
    declare_deadline_s: 170.0
    # Legacy standalone schedule length: one complete three-shape rotation.
    # D28 task resolution derives the deployed length from the task-level
    # post-readiness episode budget and leaves no separate null-report floor.
    drivers: [browse, browse, browse, checkout_readback]
  saleor_eval:
    base: saleor_dev
    repeat_cycles: 13
    declare_deadline_s: 1910.0
  saleor_temporal_eval:
    base: saleor_eval
    soak_cycles: 8
  saleor_async_dev:
    base: saleor_dev
    drivers: [browse, browse, browse, checkout_async]
  saleor_async_eval:
    base: saleor_eval
    drivers: [browse, browse, browse, checkout_async]
  # Legacy standalone long shape for 20-A2. D28 keeps readiness outside t0,
  # includes Harbor setup in the task's 2400 s post-readiness episode budget,
  # and derives the deployed pre-soak length on this cycle grid. The compatibility
  # field is intentionally unpinned here so no second timing value can conflict.
  saleor_async_eval_long:
    base: saleor_async_dev
    repeat_cycles: 24
  saleor_async_temporal_eval:
    base: saleor_async_eval
    soak_cycles: 8
  saleor_eval_ext:
    base: saleor_dev
    repeat_cycles: 17
    declare_deadline_s: 2490.0
  saleor_temporal_eval_ext:
    base: saleor_eval_ext
    soak_cycles: 8
  saleor_async_eval_ext:
    base: saleor_eval_ext
    drivers: [browse, browse, browse, checkout_async]
  saleor_async_temporal_eval_ext:
    base: saleor_async_eval_ext
    soak_cycles: 8
  saleor_mixed_dev:
    base: saleor_dev
    drivers: [browse, browse, browse, product_detail, product_detail, search,
              cart_abandon, checkout_readback, checkout_readback, login]
  saleor_mixed_eval:
    base: saleor_mixed_dev
    repeat_cycles: 13
    declare_deadline_s: 1910.0
